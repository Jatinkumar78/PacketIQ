name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run that died on a runner/infrastructure fault (no runner assigned,
  # "Internal server error") be restarted without an empty commit.
  workflow_dispatch:

# Nothing here writes to the repo, packages, or checks.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref, so a stalled run
# cannot hold matrix slots while the branch has already moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A Linux leg finishes in ~5 min; Windows is roughly twice that, so anything
    # past 25 is wedged rather than slow.
    timeout-minutes: 25
    defaults:
      run:
        # GitHub's Windows images ship bash, and using it everywhere keeps one
        # copy of each step instead of a PowerShell fork that then drifts.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter, on the OS that carries the coverage gate.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        # PacketIQ is installed and run on all three desktop platforms, and the
        # parts that differ between them are exactly the parts that break: the
        # capture-privilege model, the interface enumerator, path handling and
        # the console encoding. Claiming Windows and macOS support without ever
        # running there is a claim, not a fact — one interpreter each is enough
        # to keep it a fact, since nothing platform-specific is version-specific.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Regular (non-editable) install so the `packetiq` console script resolves
          # from any working directory (editable/.pth installs are unreliable on some
          # Python 3.12+ standalone builds; verified by the entry-point smoke test).
          # The dev extra is the single source of truth for the tooling this job
          # runs (ruff, mypy, and the type stubs the mypy gate needs). Installing
          # any of them again here would let the two lists drift apart silently.
          pip install ".[dev]"

      - name: Entry point works from any directory
        run: cd "$RUNNER_TEMP" && packetiq --help >/dev/null && python -c "import packetiq; print('import OK', packetiq.__version__)"

      - name: Lint (ruff)
        run: ruff check packetiq tools tests

      # Blocking. This was advisory (`|| true`) and reported a real defect for a
      # full release cycle: a dataclass field was deleted while the CLI still
      # read it, so `fuse` raised AttributeError on any capture that matched a
      # threat actor. mypy is clean across all 83 modules — keep it that way.
      - name: Type check (mypy)
        run: mypy packetiq

      # 100, not a margin. Every statement in the package is executed by the
      # suite, so any number below 100 means a line shipped that no test ran —
      # and the gate should say so on the commit that introduced it, not weeks
      # later. Deliberately unreachable code is deleted rather than excluded;
      # the only exclusions are `if TYPE_CHECKING`, `...` Protocol stubs,
      # `raise NotImplementedError` and `__main__` guards (see pyproject).
      #
      # Coverage has to be a property of the *suite*, not of the machine running
      # it, and four times it was not. First the platform switches (the macOS
      # branches, a host that already had capture privileges, the `tomli`
      # backport). Then tests that looked deliberate but asked the host a question
      # and accepted either answer: `/api/live/start` was allowed to return 403
      # and the test simply returned, and `packetiq chat` was handed no API keys
      # and trusted that to mean no provider — on a Mac with capture rights and
      # `ollama serve` running, both took the long branch. Then the interface
      # ranker, whose `bridge` arm ran only because this developer's Mac has four
      # bridge adapters and a Linux runner has none. Then scapy resolving an
      # unset destination MAC for real, which is an ARP request this workstation
      # is allowed to send and the macOS runner is not — and filling an unset
      # *source* MAC from whichever NIC the host happens to have.
      #
      # Six guards in tests/conftest.py make that class impossible rather than
      # merely fixed: every test gets its own history database, none may open a
      # socket, none may open a real capture device, none sees the machine's own
      # interface list, none resolves a link-layer address on the wire, and every
      # table renders at one fixed width. A path that depends on any of them has
      # to be driven with a fixture, which is the only way its coverage means the
      # same thing on every host. tests/test_harness_guards.py asserts all six
      # are still in effect.
      #
      # 3.9 is held at 100 like every other leg, and it is the strictest of them.
      # CPython 3.9 threads the conditional jump for each operand of a
      # short-circuit guard straight past the `continue` that follows it, so the
      # line is only recorded when the *last* operand is the one that fires. That
      # is not a measurement artifact to be worked around: it named twelve real
      # gaps, each a guard whose second half no test exercised — a Zeek record
      # with an originator but no responder, a banner naming a product with no
      # version, a commented-out `.env` assignment, a NetFlow template whose
      # fields have no width. 3.10+ record the line whichever operand fired and
      # reported all twelve as covered.
      - name: Unit + integration tests (with coverage gate)
        run: |
          # The gate belongs to the Linux matrix. Coverage of the platform
          # branches is necessarily different on macOS and Windows — the point of
          # those legs is that the suite passes there, and a 100% claim measured
          # on three different platforms would be three different claims.
          if [ "${{ runner.os }}" = "Linux" ]; then
            pytest -q --cov=packetiq --cov-report=term-missing --cov-fail-under=100
          else
            pytest -q
          fi

      # Standing guarantee: the deterministic grounding guardrail redacts every
      # ungrounded IP / MITRE technique / CVE / domain / file-hash. These tests use
      # no LLM, so they gate the 0-hallucination invariant on every push.
      - name: Guardrail invariant — 0 ungrounded entities (deterministic)
        run: pytest -q tests/test_grounding_guard.py tests/test_grounding.py

      # Standing guarantee: detection accuracy must not regress. The synthetic
      # labeled suite must keep 100% recall and 100% precision (exit non-zero if not).
      - name: Detection regression gate (synthetic suite)
        run: python tools/validate.py --suite --min-recall 1.0 --min-precision 1.0

      # Smoke: the throughput benchmark runs end-to-end on a generated capture.
      - name: Throughput benchmark smoke
        run: python tools/benchmark.py --demo --packets 20000

  security:
    runs-on: ubuntu-latest
    # pip-audit resolves the full dependency tree against the PyPI advisory DB;
    # if that hangs, fail the job rather than burn a 6-hour default timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Blocking, because this is the closure `pip install packetiq` actually
      # produces — anything found here reaches every user. It is clean as of
      # 2026-08-10 ("No known vulnerabilities found"), so a finding is a real
      # regression rather than pre-existing debt, and it should fail the build
      # instead of scrolling past in a green log.
      - name: pip-audit (the dependencies users install)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit

      # Advisory only, and deliberately a separate step so it cannot be confused
      # with the one above. The dev extra pulls pySigma, which pins
      # diskcache>=5.6.3,<6.0.0; 5.6.3 is simultaneously the newest release that
      # exists and the one carrying PYSEC-2026-2447 / CVE-2025-69872 (pickle
      # deserialisation, CVSS 4.0 AV:L — it needs an attacker who can already
      # write to the cache directory). There is no version to upgrade to,
      # PacketIQ imports neither package, and neither ships to a user, so an
      # unfixable test-tooling advisory must not be able to wedge the pipeline.
      - name: pip-audit (development tooling)
        continue-on-error: true
        run: |
          pip install ".[dev]"
          pip-audit

      # Blocking. Our own code currently scans clean at every severity, so any
      # new finding is a genuine regression rather than pre-existing debt.
      - name: bandit (static security scan of first-party code)
        run: |
          python -m pip install bandit
          bandit -r packetiq --severity-level low --confidence-level low

      # The audit above runs on 3.12, where every floor resolves to a patched
      # release. It says nothing about the *oldest* interpreter this project
      # supports, and that is where the risk actually lives: pillow 12.x,
      # python-dotenv 1.2.2 and python-multipart 0.0.3x all require >=3.10, so a
      # 3.9 install resolves to the newest 3.9-compatible versions — which carry
      # published advisories with nowhere to upgrade to. Advisory-only for that
      # reason, and run so the residual is visible in every log instead of being
      # a sentence in SECURITY.md that nobody re-checks.
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: pip-audit (oldest supported interpreter — advisory)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install .
          pip-audit
