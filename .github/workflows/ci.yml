name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run that died on a runner/infrastructure fault (no runner assigned,
  # "Internal server error") be restarted without an empty commit.
  workflow_dispatch:

# Nothing here writes to the repo, packages, or checks.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref, so a stalled run
# cannot hold matrix slots while the branch has already moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Whole matrix leg finishes in ~5 min; anything past 20 is wedged, not slow.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Regular (non-editable) install so the `packetiq` console script resolves
          # from any working directory (editable/.pth installs are unreliable on some
          # Python 3.12+ standalone builds; verified by the entry-point smoke test).
          # The dev extra is the single source of truth for the tooling this job
          # runs (ruff, mypy, and the type stubs the mypy gate needs). Installing
          # any of them again here would let the two lists drift apart silently.
          pip install ".[dev]"

      - name: Entry point works from any directory
        run: cd "$RUNNER_TEMP" && packetiq --help >/dev/null && python -c "import packetiq; print('import OK', packetiq.__version__)"

      - name: Lint (ruff)
        run: ruff check packetiq tools tests

      # Blocking. This was advisory (`|| true`) and reported a real defect for a
      # full release cycle: a dataclass field was deleted while the CLI still
      # read it, so `fuse` raised AttributeError on any capture that matched a
      # threat actor. mypy is clean across all 83 modules — keep it that way.
      - name: Type check (mypy)
        run: mypy packetiq

      # 100, not a margin. Every statement in the package is executed by the
      # suite, so any number below 100 means a line shipped that no test ran —
      # and the gate should say so on the commit that introduced it, not weeks
      # later. Deliberately unreachable code is deleted rather than excluded;
      # the only exclusions are `if TYPE_CHECKING`, `...` Protocol stubs,
      # `raise NotImplementedError` and `__main__` guards (see pyproject).
      #
      # Coverage has to be a property of the *suite*, not of the machine running
      # it, and it twice was not. The first round was the platform switches (the
      # macOS branches, a host that already had capture privileges, the `tomli`
      # backport). The second was subtler, because the tests in question looked
      # deliberate: they asked the host a question and accepted either answer.
      # `/api/live/start` was allowed to return 403 and the test simply returned;
      # `packetiq chat` was handed no API keys and trusted that to mean no
      # provider. On this developer's Mac capture works and `ollama serve` is
      # listening, so both took the long branch and covered 34 statements that a
      # runner never reaches.
      #
      # Two guards in tests/conftest.py now make that impossible rather than
      # merely fixed: no test may open a socket, and none may open a real capture
      # device. A path that depends on either has to be driven with a stub, which
      # is the only way its coverage means the same thing on every host. Verified
      # by measuring the suite under four simulated runner environments (Linux
      # dispatch, denied capture socket, no Ollama, no external tools) on 3.11 and
      # 3.12: 100.00% in every one.
      #
      # The floor is 99 on 3.9 for one measurement reason, not a test gap:
      # CPython 3.9 emits no trace event for `continue`/`break` — 12 such lines
      # at last measurement (99.88% overall). Verified directly rather than
      # assumed: the zeek endpoint guard demonstrably skips the record on 3.9
      # (1 of 2 flows kept, test green) while coverage still reports the line
      # unhit. The headroom below 100 is deliberate, because every new
      # `continue` in a loop costs that leg one more line for no real reason.
      # 3.10-3.12 measure faithfully and are held at exactly 100.
      - name: Unit + integration tests (with coverage gate)
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then FLOOR=99; else FLOOR=100; fi
          pytest -q --cov=packetiq --cov-report=term-missing --cov-fail-under=$FLOOR

      # Standing guarantee: the deterministic grounding guardrail redacts every
      # ungrounded IP / MITRE technique / CVE / domain / file-hash. These tests use
      # no LLM, so they gate the 0-hallucination invariant on every push.
      - name: Guardrail invariant — 0 ungrounded entities (deterministic)
        run: pytest -q tests/test_grounding_guard.py tests/test_grounding.py

      # Standing guarantee: detection accuracy must not regress. The synthetic
      # labeled suite must keep 100% recall and 100% precision (exit non-zero if not).
      - name: Detection regression gate (synthetic suite)
        run: python tools/validate.py --suite --min-recall 1.0 --min-precision 1.0

      # Smoke: the throughput benchmark runs end-to-end on a generated capture.
      - name: Throughput benchmark smoke
        run: python tools/benchmark.py --demo --packets 20000

  security:
    runs-on: ubuntu-latest
    # pip-audit resolves the full dependency tree against the PyPI advisory DB;
    # if that hangs, fail the job rather than burn a 6-hour default timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Blocking, because this is the closure `pip install packetiq` actually
      # produces — anything found here reaches every user. It is clean as of
      # 2026-08-10 ("No known vulnerabilities found"), so a finding is a real
      # regression rather than pre-existing debt, and it should fail the build
      # instead of scrolling past in a green log.
      - name: pip-audit (the dependencies users install)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit

      # Advisory only, and deliberately a separate step so it cannot be confused
      # with the one above. The dev extra pulls pySigma, which pins
      # diskcache>=5.6.3,<6.0.0; 5.6.3 is simultaneously the newest release that
      # exists and the one carrying PYSEC-2026-2447 / CVE-2025-69872 (pickle
      # deserialisation, CVSS 4.0 AV:L — it needs an attacker who can already
      # write to the cache directory). There is no version to upgrade to,
      # PacketIQ imports neither package, and neither ships to a user, so an
      # unfixable test-tooling advisory must not be able to wedge the pipeline.
      - name: pip-audit (development tooling)
        continue-on-error: true
        run: |
          pip install ".[dev]"
          pip-audit

      # Blocking. Our own code currently scans clean at every severity, so any
      # new finding is a genuine regression rather than pre-existing debt.
      - name: bandit (static security scan of first-party code)
        run: |
          python -m pip install bandit
          bandit -r packetiq --severity-level low --confidence-level low
