[build-system]
# setuptools 77 is the first release to understand PEP 639 (`license` as an SPDX
# expression plus `license-files`). This is a build-time requirement only — pip
# fetches it into an isolated build env — so it does not constrain what the
# installed package runs on.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# Project metadata (PEP 621) — the single source of truth. setup.py is gone;
# `pip install -e .` and `python -m build` read everything from here.
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "packetiq"
version = "1.1.0"
description = "AI PCAP Forensics & SOC Copilot"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 form. The old `{ file = "LICENSE" }` table and the matching
# "License :: OSI Approved" classifier are both deprecated, and each one emitted a
# SetuptoolsDeprecationWarning on every build.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jatin Kumar" }]
keywords = ["pcap", "forensics", "network-security", "soc", "threat-intel", "dfir"]

# Security-patched floors are intentional and verified to exist on PyPI; do not
# lower them (see CHANGELOG Security). Kept in lockstep with requirements.txt.
# Every floor here is a *patched* release, verified against the advisory database
# at the floor version itself rather than at whatever a fresh resolve happens to
# pick, and the whole closure resolves clean on every supported interpreter.
#
# That is a property of the Python floor, not of luck. While 3.9 was supported,
# four of these had to be declared twice — the patched floor for 3.10+, and the
# newest release 3.9 could install, which carried open advisories with nowhere to
# upgrade to. 3.10 removed most of that but not all: pillow 13.0.0 (the release
# that fixes 42 advisories reachable through reportlab) requires >= 3.11, so 3.10
# was still stuck on pillow 12.3.0. At >= 3.11 there is no residual and no split.
dependencies = [
    "scapy>=2.7.0",                  # GHSA-cq46-m9x9-j8w2 (2.5.0 and 2.6.x affected)
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.2.2",          # GHSA-mf9w-mj56-hr94 / PYSEC-2026-2270
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "requests>=2.33.0",              # GHSA-gc5v-m9x4-r6x2 / PYSEC-2026-2275
    "urllib3>=2.8.0",                # PYSEC-2026-4175/4176/4177 and prior
    "anthropic>=0.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.31",      # 12 advisories through 0.0.30
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "cryptography>=50.0.0",          # 44.0.1 itself carries 10 advisories; 50.0.0 is clean
    "reportlab>=4.0.0",              # professional PDF SOC reports (offline, pure-Python)
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",                 # GHSA-6w46-j5rx-g56g / PYSEC-2026-1845
    "pytest-cov>=4.0.0",
    "pyyaml>=6.0.0",
    "pysigma>=0.11.0",
    "yara-python>=4.3.0",
    "ruff",
    "mypy",
    # Real stubs for `requests`, not a suppression. `ignore_missing_imports` covers a
    # module mypy cannot find; it does not cover one that is installed but untyped,
    # which mypy reports as `import-untyped` and fails the gate on.
    "types-requests",
]
yara = ["yara-python>=4.3.0"]
geoip = ["geoip2>=4.7.0"]

[project.scripts]
packetiq = "packetiq.cli:main"

[project.urls]
# These render as the sidebar links on the PyPI project page, so a wrong one is
# published rather than merely wrong in a file. Homepage used to name an account
# that belongs to an unrelated person (a plausible-looking typo for this
# project's own name), and Changelog omitted the repository segment entirely and
# returned 404. tests/test_docs_and_community_health.py now asserts the shape of
# every one of these, which is also why the old URL is described here rather
# than quoted: that gate refuses the literal string anywhere in the file.
Homepage = "https://github.com/Jatinkumar78/PacketIQ"
Repository = "https://github.com/Jatinkumar78/PacketIQ"
Issues = "https://github.com/Jatinkumar78/PacketIQ/issues"
Changelog = "https://github.com/Jatinkumar78/PacketIQ/blob/main/CHANGELOG.md"
Security = "https://github.com/Jatinkumar78/PacketIQ/blob/main/SECURITY.md"
Documentation = "https://github.com/Jatinkumar78/PacketIQ#readme"

# ── Packaging: discover the package and ship its bundled data files ──────────
[tool.setuptools.packages.find]
include = ["packetiq*"]

[tool.setuptools.package-data]
packetiq = [
    "detection/data/*.csv",
    "detection/data/yara_rules/*",
    "enrichment/data/*",
    "profiles/*.toml",
    "webapp/templates/*.html",
    "webapp/static/vendor/*.js",
    "dashboard/templates/*.html",
]

# ─────────────────────────────────────────────────────────────────────────────
# Tooling configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    # macOS system Python links against LibreSSL, not OpenSSL — urllib3 says so on
    # import. Cosmetic, unrelated to PacketIQ; keep the test summary clean.
    "ignore:urllib3 v2 only supports OpenSSL",
]

# Coverage is measured in CI (not in the default local addopts, so a plain
# `pytest` stays fast). The CI step runs, on the Linux legs only:
#   pytest -q --cov=packetiq --cov-report=term-missing --cov-fail-under=100
# The whole package is measured — nothing is omitted to inflate the number,
# including the hardware-dependent live-capture path and terminal renderers.
[tool.coverage.run]
source = ["packetiq"]
branch = false

[tool.coverage.report]
# Exclude only genuinely non-executable / defensive lines (coverage.py's own
# recommended defaults) — not whole modules.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    # Anchored, and deliberately so. The bare `\.\.\.` this replaces matched any line
    # containing three dots anywhere — including `File(...)` in a FastAPI signature and
    # every `"Parsing packets..."` progress string. coverage.py drops the *whole body*
    # when the matching line opens a block, so `/api/upload`, `/api/fuse` and
    # `/api/analyze` plus 32 statements of cli.py were silently absent from the
    # denominator: 98 statements the gate could never fail on. The intent was only ever
    # to skip `...` Protocol stubs, which is exactly what the anchors now express.
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "venv", "samples", "build", "dist"]

[tool.ruff.lint]
# Pragmatic rule set: real bugs + basic hygiene, not style nitpicking.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter, not enforced hard
    "E701",   # compact one-liner conditionals are a deliberate style here
    "E702",   # compact statements (e.g. test fixtures) are intentional
    "E741",   # ambiguous var names (l, etc.) used in parsers
    "F841",   # unused locals — kept for readability in some report builders
    "B007",   # loop control var not used (regex .finditer presence checks)
    "B008",   # function calls in argument defaults (FastAPI Depends/File patterns)
    # UP042 wants `class Severity(StrEnum)` instead of `class Severity(str, Enum)`,
    # and that is not a refactor — it changes what these two enums *print*. Measured
    # on 3.12: f"{Mixed.PORT_SCAN}" is "Mixed.PORT_SCAN" for a (str, Enum) member and
    # "port_scan" for a StrEnum one. Three places would change silently with it: the
    # alert dedup key in alerts/dispatcher.py (existing dedup state would stop
    # matching, so every suppressed alert could fire once more), the grouping key in
    # sigma/generator.py, and DetectionEvent.__str__, which is user-visible output.
    # Switching is a deliberate output change for a release to make, not a lint fix.
    "UP042",
]

[tool.mypy]
# Mirrors `requires-python` exactly, which it could not do while 3.9 was
# supported: mypy 2.x refuses to target anything below 3.10, so "3.9" here was
# silently ignored and 3.10 semantics were checked against a 3.9 promise. With the
# floor at 3.11 the type gate checks the oldest interpreter that is actually
# shipped, and typeshed rejects a 3.12+ stdlib symbol used without a guard.
# tests/test_python311_compat.py covers the grammar side, which mypy does not own.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
# Advisory notes about un-analysed bodies in untyped functions; they are not
# findings and drown the real errors this gate exists to surface.
disable_error_code = ["annotation-unchecked"]
exclude = "(^|/)(\\.venv|venv|build|dist|samples)/"
