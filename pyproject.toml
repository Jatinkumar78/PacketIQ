[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# Project metadata (PEP 621) — the single source of truth. setup.py is gone;
# `pip install -e .` and `python -m build` read everything from here.
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "packetiq"
version = "1.0.0"
description = "AI PCAP Forensics & SOC Copilot"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jatin Kumar" }]
keywords = ["pcap", "forensics", "network-security", "soc", "threat-intel", "dfir"]

# Security-patched floors are intentional and verified to exist on PyPI; do not
# lower them (see CHANGELOG Security). Kept in lockstep with requirements.txt.
dependencies = [
    "scapy>=2.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "requests>=2.32.4",              # CVE-2024-47081 (.netrc credential leak)
    "urllib3>=2.6.0",                # decompression-bomb DoS fix
    "anthropic>=0.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.18",      # CVE-2024-53981 (parser DoS)
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "cryptography>=44.0.1",          # GHSA-537c-gmf6-5ccf and prior
    "reportlab>=4.0.0",              # professional PDF SOC reports (offline, pure-Python)
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0", "pyyaml>=6.0.0", "pysigma>=0.11.0", "yara-python>=4.3.0", "ruff", "mypy"]
yara = ["yara-python>=4.3.0"]
geoip = ["geoip2>=4.7.0"]

[project.scripts]
packetiq = "packetiq.cli:main"

[project.urls]
Homepage = "https://github.com/PacketIQ"
Changelog = "https://github.com/PacketIQ/blob/main/CHANGELOG.md"

# ── Packaging: discover the package and ship its bundled data files ──────────
[tool.setuptools.packages.find]
include = ["packetiq*"]

[tool.setuptools.package-data]
packetiq = [
    "detection/data/*.csv",
    "detection/data/yara_rules/*",
    "enrichment/data/*",
    "webapp/templates/*.html",
    "webapp/static/vendor/*.js",
    "dashboard/templates/*.html",
]

# ─────────────────────────────────────────────────────────────────────────────
# Tooling configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    # macOS system Python links against LibreSSL, not OpenSSL — urllib3 says so on
    # import. Cosmetic, unrelated to PacketIQ; keep the test summary clean.
    "ignore:urllib3 v2 only supports OpenSSL",
]

# Coverage is measured in CI (not in the default local addopts, so a plain
# `pytest` stays fast). The CI step runs: pytest --cov=packetiq --cov-fail-under=85
# The whole package is measured — nothing is omitted to inflate the number,
# including the hardware-dependent live-capture path and terminal renderers.
[tool.coverage.run]
source = ["packetiq"]
branch = false

[tool.coverage.report]
# Exclude only genuinely non-executable / defensive lines (coverage.py's own
# recommended defaults) — not whole modules.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".venv", "venv", "samples", "build", "dist"]

[tool.ruff.lint]
# Pragmatic rule set: real bugs + basic hygiene, not style nitpicking.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter, not enforced hard
    "E701",   # compact one-liner conditionals are a deliberate style here
    "E702",   # compact statements (e.g. test fixtures) are intentional
    "E741",   # ambiguous var names (l, etc.) used in parsers
    "F841",   # unused locals — kept for readability in some report builders
    "B007",   # loop control var not used (regex .finditer presence checks)
    "B008",   # function calls in argument defaults (FastAPI Depends/File patterns)
]

[tool.mypy]
# mypy 2.x refuses to target anything below 3.10, so this cannot mirror
# requires-python (">=3.9"). The 3.9 floor the CI matrix actually tests is
# enforced by tests/test_python39_compat.py instead; leaving "3.9" here only
# produced an "unsupported" warning while silently checking 3.10 semantics.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
# Advisory notes about un-analysed bodies in untyped functions; they are not
# findings and drown the real errors this gate exists to surface.
disable_error_code = ["annotation-unchecked"]
exclude = "(^|/)(\\.venv|venv|build|dist|samples)/"
